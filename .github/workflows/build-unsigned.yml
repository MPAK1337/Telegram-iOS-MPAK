name: Build MPAK Mod Unsigned IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Install Dependencies
        run: |
          brew install bazelisk
          pip3 install -U pip --break-system-packages || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/bazel-disk-cache
            ~/.cache/bazel
          key: bazel-macos26-${{ hashFiles('WORKSPACE', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '**/*.bzl', '**/BUILD*') }}
          restore-keys: |
            bazel-macos26-

      # ВАЖНО: без этого шага Make.py не видит "identity" и падает на signing
      - name: Import fake certificates (for unsigned IPA)
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true

      - name: Build Swiftgram IPA (Unsigned)
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-disk-cache" \
            --overrideBazelVersion \
            --bazelArguments="--//Telegram:disableWatchApp --//Telegram:disableExtensions" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --codesigningInformationPath=build-system/fake-codesigning

      - name: Find Built IPA
        id: find_ipa
        run: |
          echo "Searching for IPA files..."
          find . -name "*.ipa" -type f 2>/dev/null | head -20 || true

          IPA_PATH=$(find . -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA: $IPA_PATH"
            echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          else
            echo "No IPA found"
            exit 1
          fi

      - name: Upload MPAK Mod IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-MPAK-Mod-unsigned-${{ github.run_number }}
          path: |
            **/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the IPA from Artifacts and re-sign it on-device with ESign." >> $GITHUB_STEP_SUMMARY
